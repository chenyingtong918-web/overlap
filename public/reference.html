<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Previous prototype reference</title><style>body{margin:0}#room-social{width:393px!important;max-width:393px!important;margin:0!important;border-radius:0!important;border:none!important}</style></head><body><div id="room-social" aria-label="Room social app prototype" lang="en">
<style>
#room-social{--page:light-dark(#fafafa,#121216);--surface:light-dark(#fff,#1b1b21);--ink:light-dark(#18181c,#f1f1f6);--muted:light-dark(#6e6e7a,#aaaab9);--line:light-dark(#e9e9ef,#33333f);--soft:light-dark(#f3f3f7,#24242d);--accent:light-dark(#5b47e8,#b4a7ff);--accent-on:light-dark(#fff,#211a48);--tint:light-dark(#f0edff,#2e2647);--strong:light-dark(#1d1d24,#eeeeF5);--strong-on:light-dark(#fff,#18181d);--error:light-dark(#b32744,#ff9ab1);--radius:16px;background:var(--page);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;max-width:660px;margin:auto;border:1px solid var(--line);border-radius:24px;overflow:hidden}
#room-social *{box-sizing:border-box}#room-social [hidden]{display:none!important}#room-social button,#room-social input,#room-social textarea,#room-social select{font:inherit;color:inherit}#room-social button{cursor:pointer;min-height:44px}#room-social button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}#room-social h1,#room-social h2,#room-social h3,#room-social p{margin:0}#room-social h1{font-size:31px;line-height:1.18;letter-spacing:-1.2px;font-weight:500}#room-social h2{font-size:23px;line-height:1.25;letter-spacing:-.5px;font-weight:500}#room-social h3{font-size:17px;line-height:1.4;font-weight:500}#room-social .top{padding:17px 25px;display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-bottom:1px solid var(--line);gap:12px}#room-social .wordmark{font-size:27px;letter-spacing:-1.5px;font-weight:500;display:flex;gap:9px;align-items:center}#room-social .logo{width:22px;height:22px;display:inline-block;border:5px solid var(--accent);border-radius:7px 7px 7px 0;transform:rotate(-8deg)}#room-social .micro{font-size:11px;color:var(--muted)}#room-social .eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}#room-social .muted{color:var(--muted)}#room-social .small{font-size:13px}#room-social main{padding:25px}#room-social .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#room-social .between{justify-content:space-between}#room-social .grow{flex:1;min-width:0}#room-social .stack{display:grid;gap:15px}#room-social .mt{margin-top:22px}#room-social .mt-sm{margin-top:10px}#room-social .mt-xs{margin-top:5px}#room-social .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}#room-social .primary,#room-social .secondary,#room-social .accent{border-radius:10px;padding:10px 16px;border:1px solid transparent;font-weight:500;display:inline-flex;gap:8px;align-items:center;justify-content:center}#room-social .primary{background:var(--strong);color:var(--strong-on)}#room-social .accent{background:var(--accent);color:var(--accent-on)}#room-social .secondary{background:var(--surface);border-color:var(--line)}#room-social .quiet{border:0;background:transparent;padding:7px 3px;color:var(--muted);display:inline-flex;gap:7px;align-items:center;justify-content:center}#room-social .full{width:100%}#room-social .icon{width:18px;height:18px;vertical-align:middle;flex-shrink:0}#room-social .icon:not(svg){display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:17px}#room-social .icon:not(svg)::before{content:attr(data-fallback)}#room-social .icon-button{border:1px solid var(--line);background:var(--surface);border-radius:12px;display:grid;place-items:center;width:44px;flex:0 0 44px}#room-social .tag{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:6px;padding:4px 8px;font-size:11px}#room-social .tag.accent-text{color:var(--accent);background:var(--tint)}#room-social .tabs{display:flex;gap:6px;margin-top:20px;flex-wrap:wrap}#room-social .pill{border:1px solid var(--line);background:var(--surface);border-radius:24px;min-height:36px;padding:6px 13px;font-size:13px}#room-social .pill[aria-pressed=true]{background:var(--strong);color:var(--strong-on);border-color:var(--strong)}#room-social .avatar{width:38px;height:38px;flex:0 0 38px;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:500;letter-spacing:-.5px}#room-social .avatar.purple{background:var(--tint);border-color:var(--tint);color:var(--accent)}#room-social .person{display:flex;gap:10px;align-items:center}#room-social .person h3{font-size:14px}#room-social .lunch-banner{position:relative;overflow:hidden;background:var(--tint);border:1px solid var(--line);border-radius:var(--radius);padding:22px;min-height:156px}#room-social .lunch-banner .copy{max-width:76%;position:relative;z-index:1}#room-social .lunch-banner h2{margin:7px 0 14px}#room-social .mini-deck{position:absolute;right:24px;top:30px;width:72px;height:94px;border-radius:11px;background:var(--surface);color:var(--accent);border:1px solid var(--line);transform:rotate(12deg);display:grid;place-items:center;font-size:30px;box-shadow:-8px 4px 0 var(--accent)}#room-social .feed-post{border-bottom:1px solid var(--line);padding:23px 0}#room-social .feed-post:last-child{border:0;padding-bottom:5px}#room-social .post-copy{margin:13px 0;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap}#room-social .activity-preview{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px;display:flex;align-items:center;gap:14px}#room-social .activity-tile{width:55px;height:62px;flex:0 0 55px;background:var(--tint);border-radius:8px;display:grid;place-items:center;color:var(--accent)}#room-social .activity-tile .icon{width:23px;height:23px}#room-social .post-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:9px}#room-social .nav{display:flex;align-items:center;gap:5px;padding:11px 17px;background:var(--surface);border-top:1px solid var(--line)}#room-social .nav button{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;font-size:11px;min-height:48px;border:0;background:transparent;color:var(--muted);border-radius:10px}#room-social .nav button.active{color:var(--accent)}#room-social .nav button .icon{width:21px;height:21px}#room-social .nav .create{flex:0 0 48px;background:var(--strong);color:var(--strong-on);border-radius:15px;min-height:44px;margin:0 8px}#room-social .nav .create .icon{width:23px;height:23px}#room-social label.field{display:block;font-size:12px;font-weight:500;margin:18px 0 7px}#room-social input:not([type=checkbox]),#room-social textarea,#room-social select{display:block;width:100%;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:16px}#room-social textarea{min-height:95px;resize:vertical}#room-social .fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}#room-social .check{display:flex;align-items:flex-start;gap:8px;font-size:13px;margin:16px 0}#room-social .check input{margin-top:5px;accent-color:var(--accent)}#room-social .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}#room-social .notice{background:var(--tint);color:var(--ink);border-radius:10px;padding:12px 15px;font-size:13px;margin-bottom:18px}#room-social .error{color:var(--error);font-size:13px;margin-top:8px}#room-social .empty{padding:35px 15px;text-align:center}#room-social .steps{display:flex;gap:5px;margin:15px 0 24px}#room-social .steps span{flex:1;height:3px;background:var(--line)}#room-social .steps .done{background:var(--accent)}#room-social .profile-pass{background:var(--tint);padding:22px;border-radius:var(--radius);margin-top:20px}#room-social .deck{margin:28px auto;max-width:315px;padding:32px 25px;background:var(--surface);border:1px solid var(--line);border-radius:18px;text-align:center;box-shadow:7px 7px 0 var(--tint),8px 8px 0 var(--line);color:var(--ink)}#room-social .deck-mark{margin:14px 0;font-size:54px;font-weight:500;color:var(--accent)}#room-social .ticket{max-width:430px;margin:24px auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:25px;animation:room-card-reveal .22s ease-out}#room-social .tear{border-top:1px dashed var(--line);padding-top:16px;margin-top:20px}#room-social .week-labels,#room-social .month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}#room-social .week-labels{font-size:11px;color:var(--muted);margin:20px 0 8px}#room-social .day{border:0;position:relative;background:transparent;border-radius:12px;padding:8px 0 12px;min-height:43px;font-size:13px}#room-social .day.current{box-shadow:inset 0 0 0 1px var(--line)}#room-social .day.selected{background:var(--strong);color:var(--strong-on)}#room-social .event-dot{position:absolute;bottom:5px;left:calc(50% - 2px);width:4px;height:4px;border-radius:50%;background:currentColor}#room-social .agenda-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left;padding:16px;width:100%;display:flex;gap:17px;align-items:flex-start}#room-social .time-col{font-size:13px;font-weight:500;min-width:43px;color:var(--accent)}#room-social .inbox-row{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:20px 0}#room-social .inbox-row .snippet{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}#room-social .thread-summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:20px 0}#room-social .thread-summary .actions{margin-top:15px}#room-social .messages{display:flex;flex-direction:column;gap:13px;padding:4px 0 20px;min-height:130px}#room-social .bubble{max-width:85%;background:var(--soft);border-radius:14px 14px 14px 3px;padding:11px 14px;align-self:flex-start;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}#room-social .bubble.me{background:var(--tint);border-radius:14px 14px 3px 14px;align-self:flex-end}#room-social .system{text-align:center;font-size:11px;color:var(--muted);padding:5px 20px}#room-social .chat-form{display:flex;gap:9px;align-items:center;border-top:1px solid var(--line);padding-top:14px}#room-social .chat-form input{flex:1;min-width:0}#room-social .chat-form button{width:44px;flex:0 0 44px;padding:10px}#room-social .choice{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:19px;display:flex;align-items:center;gap:14px;text-align:left;width:100%}#room-social .choice .tile{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:0 0 44px}#room-social .rule{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}#room-social .badge{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;font-size:12px;margin:5px 5px 0 0}
@keyframes room-card-reveal{from{transform:translateY(7px) rotate(-1deg)}to{transform:translateY(0) rotate(0)}}@media(prefers-reduced-motion:reduce){#room-social .ticket{animation:none}}@media(max-width:430px){#room-social main{padding:19px}#room-social .top{padding:15px 19px}#room-social h1{font-size:28px}#room-social h2{font-size:21px}#room-social .fields{grid-template-columns:1fr}#room-social .lunch-banner{padding:19px}#room-social .lunch-banner .copy{max-width:73%}#room-social .mini-deck{width:52px;height:77px;right:19px;top:34px}#room-social .nav{padding:10px 10px;gap:2px}#room-social .nav .create{margin:0 3px;flex-basis:44px}#room-social .activity-preview{gap:10px;padding:13px}#room-social .activity-tile{width:44px;flex-basis:44px}#room-social .ticket{padding:21px}#room-social .primary,#room-social .accent,#room-social .secondary{padding:10px 13px}}

#room-social .quick-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
#room-social .quick-card{border:1px solid var(--line);border-radius:var(--radius);padding:21px;text-align:left;display:flex;align-items:stretch;flex-direction:column;min-width:0;background:var(--surface);color:var(--ink)}
#room-social .quick-card.lunch{background:var(--tint)}
#room-social .quick-top{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:17px}
#room-social .quick-icon{width:35px;height:35px;display:grid;place-items:center;border-radius:10px;background:var(--surface);color:var(--accent)}
#room-social .coffee .quick-icon{background:var(--soft);color:var(--ink)}
#room-social .quick-title{font-size:23px;font-weight:500;line-height:1.25;letter-spacing:-.5px}

#room-social .quick-action{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13px;font-weight:500;margin-top:auto;padding-top:13px;border-top:1px solid var(--line)}
#room-social .quick-card:hover{border-color:var(--accent)}
@media(max-width:430px){#room-social .quick-pair{gap:10px}#room-social .quick-card{padding:14px}#room-social .quick-title{font-size:20px;min-height:50px}#room-social .quick-top{margin-bottom:13px}#room-social .quick-description{font-size:12px;margin:7px 0 17px}#room-social .quick-action{font-size:12px;gap:3px}#room-social .quick-action .icon{width:15px;height:15px}}

<header class="top"><div class="wordmark"><span class="logo" aria-hidden="true"></span>room</div><span class="micro">INTERACTIVE CONCEPT · DEMO</span></header>
<main></main><nav class="nav" aria-label="Main navigation"></nav>
<script>
(()=>{
const root=document.getElementById('room-social'),main=root.querySelector('main'),nav=root.querySelector('nav');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(name,fallback='·')=>'<i class="icon" data-lucide="'+name+'" data-fallback="'+fallback+'" aria-hidden="true"></i>';
const b=(label,a,cls='primary',attrs='')=>'<button type="button" class="'+cls+'" data-a="'+a+'" '+attrs+'>'+label+'</button>';
const field=(label,id,value='',placeholder='',area=false)=>'<label class="field" for="room-'+id+'">'+label+'</label><'+(area?'textarea':'input')+' id="room-'+id+'" '+(!area?'value="'+esc(value)+'"':'')+' placeholder="'+esc(placeholder)+'" maxlength="400">'+(area?esc(value)+'</textarea>':'');
const select=(label,id,values,chosen)=>'<label class="field" for="room-'+id+'">'+label+'</label><select id="room-'+id+'">'+values.map(v=>'<option '+(v===chosen?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select>';
const chips=(values,chosen,a)=>'<div class="tabs">'+values.map(v=>b(esc(v),a,'pill','data-value="'+esc(v)+'" aria-pressed="'+(Array.isArray(chosen)?chosen.includes(v):chosen===v)+'"')).join('')+'</div>';
const initials=n=>n.split(' ').slice(0,2).map(v=>v[0]).join('');
const person=(name,sub,purple=false)=>'<div class="person"><span class="avatar '+(purple?'purple':'')+'">'+esc(initials(name))+'</span><div class="grow"><h3>'+esc(name)+'</h3><div class="micro">'+esc(sub)+'</div></div></div>';
const back=(target='home')=>b(icon('arrow-left','←')+' Back',target,'quiet');
const profile={name:'Mia Chen',role:'Product designer',campus:'Riverside campus',interests:['Photography','Coffee'],recent:'Collecting little details on my way home.',style:'Easy conversation',size:'2–3 people',diet:'No restrictions',format:'Both',share:'Finding inspiration in everyday things',learn:'Moving from design into product',visibility:'Same-campus colleagues',requests:true};
const posts=[{id:1,name:'Alex Lin',role:'Designer · Building A',stamp:'8 min ago',kind:'Interest hangout',format:'In person',text:'Taking the long way home with a camera today. Anyone up for a slow walk? Phone photos and accidental masterpieces welcome.',title:'A photo walk, no perfect shots',day:16,time:'18:30',duration:'45 min',place:'Riverside entrance',icon:'camera',like:false,question:'Anything you would love to photograph?'},{id:2,name:'Zoe Wu',role:'Product manager · Remote',stamp:'18 min ago',kind:'Topic chat',format:'Online',text:'I moved from design into product last year. Happy to share what surprised me — and hear what you are figuring out.',title:'Design → product: the honest version',day:18,time:'15:00',duration:'20 min',place:'Meeting link after confirmation',icon:'video',like:false,question:'What would you like to talk about?'},{id:3,name:'Noah Yu',role:'Operations · Building B',stamp:'32 min ago',kind:'Just sharing',format:'In person',text:'A new little coffee place just opened downstairs. Very good excuse to take a proper break.',title:'Coffee around the corner',day:17,time:'15:00',duration:'15 min',place:'Corner Coffee · Building B',icon:'coffee',like:false,question:'Send a little invitation to Noah.'}];
const threads=[{id:101,key:'photo-seed',title:'The long way home',person:'Alex Lin',kind:'Interest hangout',format:'In person',day:16,time:'18:30',duration:'45 min',place:'Riverside entrance',status:'Confirmed',messages:[{from:'them',text:'I will bring my camera. No plan beyond seeing where the light takes us.'},{from:'me',text:'Love that. I will bring my phone and a few ideas.'}]},{id:102,key:'coffee-request',title:'A little creative reset',person:'Jamie Park',kind:'Topic chat',format:'Online',day:17,time:'14:30',duration:'20 min',place:'External meeting app',status:'Invitation received',messages:[{from:'them',text:'Your post about everyday inspiration stayed with me. Want to compare notes over a short virtual coffee?'}]}];
let page='home',notice='',feedFilter='All',inboxFilter='All',selectedPost=1,activeThread=101,day=16,month=8,year=2026,step=0,editing=false,meal='Lunch',drawn=false,drawIndex=0,composeKind='Just sharing',composeFormat='In person',returnFromForm='create';
let compose={text:'',title:'',time:'12:15',date:'2026-09-16',place:'Riverside café',note:''};const memories=[];
const value=id=>main.querySelector('#room-'+id)?.value??'';
const thread=()=>threads.find(t=>t.id===activeThread);
const live=t=>!['Cancelled','Declined','Completed'].includes(t.status);
const dateLabel=(d,m=8,y=2026)=>new Date(y,m,d).toLocaleDateString('en-US',{month:'short',day:'numeric'});
function saveProfile(){for(const key of Object.keys(profile)){const el=main.querySelector('#room-'+key);if(el)profile[key]=el.type==='checkbox'?el.checked:el.value}}
function saveCompose(){['text','title','time','date','place','note'].forEach(k=>{const el=main.querySelector('#room-compose-'+k);if(el)compose[k]=el.value})}
function openThread(t){activeThread=t.id;render('thread')}
function addThread(t){let found=threads.find(x=>x.key===t.key&&live(x));if(found){notice='This conversation is already in your inbox.';openThread(found);return}const created={id:Date.now(),messages:[],...t};threads.unshift(created);activeThread=created.id;render('thread')}
function preview(){return '<div class="profile-pass"><div class="eyebrow">YOUR PERSONAL CARD</div><div class="mt">'+person(profile.name||'Your name',profile.role||'A colleague nearby',true)+'</div><p class="mt-sm">'+esc(profile.recent||'A little space for your own story.')+'</p><div class="mt-sm">'+profile.interests.map(v=>'<span class="badge">'+esc(v)+'</span>').join('')+'</div><p class="micro mt">Visible to: '+esc(profile.visibility)+'</p></div>'}
function eventSummary(t){return '<div class="thread-summary"><div class="row between"><span class="tag accent-text">'+esc(t.status)+'</span><span class="tag">'+icon(t.format==='Online'?'video':'map-pin',t.format==='Online'?'↗':'⌖')+esc(t.format)+'</span></div><h3 class="mt-sm">'+esc(t.title)+'</h3><p class="small muted mt-sm">'+dateLabel(t.day,t.month??8,t.year??2026)+' · '+esc(t.time)+' · '+esc(t.duration)+'</p><p class="small muted mt-xs">'+esc(t.place)+'</p>'+(t.status==='Invitation received'?'<div class="actions">'+b('Accept invitation','accept','accent')+b('Suggest a time','reschedule','secondary')+b('Decline','decline','quiet')+'</div>':t.status==='Awaiting reply'?'<p class="micro mt-sm">Not confirmed. Your proposed time is not reserved.</p><div class="actions">'+b('Withdraw invitation','cancel','quiet')+'</div>':t.status==='Confirmed'?'<div class="actions">'+b(t.format==='Online'?icon('video','↗')+' Open meeting':icon('map-pin','⌖')+' Meeting point',t.format==='Online'?'meeting':'location','primary')+b(icon('calendar-days','▦')+' Calendar','event-calendar','secondary')+'</div><div class="row mt-sm">'+b('Reschedule','reschedule','quiet')+b('Leave plan','cancel','quiet')+b('Finish & reflect','finish','quiet')+'</div>':'<p class="micro mt-sm">The conversation is still here.</p>')+'</div>'}
